name: .NET Build and Test
  
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SOLUTION_FILE: Pinger.sln

jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    steps:
      - name: Show Ubuntu version
        run: lsb_release -a

  restore:
    runs-on: ubuntu-22.04
    needs: diagnostic
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

  build:
    runs-on: ubuntu-22.04
    needs: restore
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'      
      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release

  semgrep:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/csharp            

  test:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test --configuration Release --verbosity normal
